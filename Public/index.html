<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Digest Bot</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #1a1d24;
            --text: #e8e8e8;
            --muted: #9aa0aa;
            --accent: #2AABEE; /* Telegram blue */
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
        }
        .card {
            max-width: 480px;
            background: var(--card);
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 12px;
        }
        p {
            color: var(--muted);
            line-height: 1.5;
            margin: 0 0 28px;
        }
        .btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 999px;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.85; }
        .links {
            margin-top: 20px;
            font-size: 14px;
        }
        .links a {
            color: var(--muted);
            text-decoration: none;
        }
        .links a:hover { color: var(--text); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🧠</div>
        <h1>AI Digest Bot</h1>
        <p>
            A daily digest of the top AI research papers from Hugging Face,
            summarized and delivered straight to Telegram — every morning,
            no scrolling required.
        </p>
        <a class="btn" href="https://t.me/Artan2005Bot" target="_blank" rel="noopener">
            Open in Telegram
        </a>
        <div class="links">
            <a href="/digests">View past digests →</a>
        </div>
    </div>
</body>
</html>
